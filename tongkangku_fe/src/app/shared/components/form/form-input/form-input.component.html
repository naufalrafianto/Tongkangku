@switch (type()) {
  @case ("number") {
    <input
      type="number"
      [placeholder]="placeholder()"
      [formControl]="control()"
      class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500 disabled:bg-slate-100 disabled:text-slate-400"
    />
  }
  @default {
    <input
      [type]="type()"
      [placeholder]="placeholder()"
      [formControl]="control()"
      class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500 disabled:bg-slate-100 disabled:text-slate-400"
    />
  }
}
