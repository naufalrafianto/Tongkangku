<div class="flex flex-col gap-1.5">
  <label class="text-sm font-medium text-slate-700">
    {{ label() }}
    @if (required()) {
      <span class="text-red-500">*</span>
    }
  </label>

  <ng-content />

  @if (error()) {
    <small class="text-xs text-red-600">
      {{ error() }}
    </small>
  }
</div>
