<select
  [formControl]="control()"
  class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500 disabled:bg-slate-100 disabled:text-slate-400"
>
  <option [ngValue]="null">{{ placeholder() }}</option>

  @for (option of options(); track option.value) {
    <option [ngValue]="option.value">
      {{ option.label }}
    </option>
  }
</select>
