<nav class="border-b border-slate-200 bg-white">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 justify-between">
      <div class="flex">
        <div class="flex flex-shrink-0 items-center">
          <a routerLink="/" class="text-xl font-bold text-blue-600"
            >Tongkangku</a
          >
        </div>

        <div class="hidden sm:ml-8 sm:flex sm:items-center sm:space-x-4">
          <a
            routerLink="/rental-request"
            routerLinkActive="border-blue-600 text-blue-600"
            [routerLinkActiveOptions]="{ exact: true }"
            class="inline-flex items-center border-b-2 border-transparent px-1 pt-1 text-sm font-medium text-slate-500 hover:border-slate-300 hover:text-slate-700"
          >
            Rentals
          </a>

          @if (isOwner()) {
            <a
              routerLink="/vessels"
              routerLinkActive="border-blue-600 text-blue-600"
              [routerLinkActiveOptions]="{ exact: true }"
              class="inline-flex items-center border-b-2 border-transparent px-1 pt-1 text-sm font-medium text-slate-500 hover:border-slate-300 hover:text-slate-700"
            >
              My Vessels
            </a>
            <a
              routerLink="/vessels/create"
              routerLinkActive="bg-blue-700"
              class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-sm transition hover:bg-blue-700"
            >
              <svg
                class="mr-1.5 h-3.5 w-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
                />
              </svg>
              Create Vessel
            </a>
          }
        </div>
      </div>

      <div class="hidden sm:ml-6 sm:flex sm:items-center">
        @if (currentUser) {
          <div class="relative ml-3">
            <button
              type="button"
              (click)="toggleProfile()"
              class="flex rounded-full bg-slate-100 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
              <span class="sr-only">Open user menu</span>
              <div class="flex items-center space-x-2">
                <span class="font-medium text-slate-700">{{
                  currentUser.name
                }}</span>
                <span
                  class="rounded bg-blue-50 px-1.5 py-0.5 text-[10px] font-semibold text-blue-600 border border-blue-100"
                >
                  {{ getRoleName(currentUser.role) }}
                </span>
              </div>
            </button>

            @if (isProfileOpen) {
              <div
                class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none"
              >
                <button
                  type="button"
                  (click)="logout()"
                  class="block w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-100"
                >
                  Sign out
                </button>
              </div>
            }
          </div>
        } @else {
          <a
            routerLink="/login"
            class="text-sm font-medium text-slate-700 hover:text-slate-900"
          >
            Log in
          </a>
        }
      </div>

      <div class="-mr-2 flex items-center sm:hidden">
        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="inline-flex items-center justify-center rounded-md p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-500 focus:outline-none"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  @if (isMobileMenuOpen) {
    <div
      class="space-y-1 border-t border-slate-200 bg-white px-2 pt-2 pb-3 sm:hidden"
    >
      <a
        routerLink="/rental-request"
        (click)="closeMenus()"
        class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900"
      >
        Rentals
      </a>

      @if (isOwner()) {
        <a
          routerLink="/vessels"
          (click)="closeMenus()"
          class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900"
        >
          My Vessels
        </a>
        <a
          routerLink="/vessels/create"
          (click)="closeMenus()"
          class="block rounded-md bg-blue-50 px-3 py-2 text-base font-semibold text-blue-600 hover:bg-blue-100"
        >
          + Create Vessel
        </a>
      }

      @if (currentUser) {
        <button
          type="button"
          (click)="logout()"
          class="block w-full rounded-md px-3 py-2 text-left text-base font-medium text-red-600 hover:bg-red-50"
        >
          Sign out
        </button>
      } @else {
        <a
          routerLink="/login"
          (click)="closeMenus()"
          class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900"
        >
          Log in
        </a>
      }
    </div>
  }
</nav>
